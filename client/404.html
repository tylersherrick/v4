<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const base = "/v4";

      if (path.startsWith(base)) {
        const route = path.slice(base.length);

        window.location.replace(
          base + "/?/" + route
        );
      }
    </script>
  </head>
  <body></body>
</html>
